<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seamless Looping Henna (Mehndi) Self-Drawing Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: transparent; /* Completely transparent background */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .animation-container {
      position: relative;
      width: 800px;
      height: 800px;
      max-width: 95vw;
      max-height: 95vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }
    svg {
      width: 100%;
      height: 100%;
      background: transparent;
    }
    /* Ink Stroke Glow and Texture */
    .henna-stroke {
      fill: none;
      stroke: #3b0910; /* Deep Mahogany Henna Ink */
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0px 1px 1px rgba(59, 9, 16, 0.25));
      transition: opacity 1.2s ease-in-out;
    }
    .henna-fill {
      fill: #3b0910;
      transition: opacity 1.2s ease-in-out, transform 1s ease-out;
    }
    .henna-gold {
      stroke: #540d17;
    }
  </style>
</head>
<body>

  <div class="animation-container">
    <svg viewBox="0 0 1000 1000" id="hennaSvg">
      <defs>
        <filter id="inkTexture" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
      <g id="mandalaGroup" filter="url(#inkTexture)"></g>
    </svg>
  </div>

  <script>
    // Create Mandala Geometry dynamically for maximum detail & smooth stroke drawing animation
    const container = document.getElementById('mandalaGroup');
    const CENTER = 500;
    let pathsToAnimate = [];

    function createHennaMandala() {
      container.innerHTML = '';
      pathsToAnimate = [];

      // 1. Center Floral Core
      addCircle(CENTER, CENTER, 12, 3, "#3b0910", 0);
      addCircle(CENTER, CENTER, 28, 2, "#540d17", 200);

      // 8-Petal Center Flower
      for (let i = 0; i < 8; i++) {
        const angle = (i * 45) * Math.PI / 180;
        const x1 = CENTER + 28 * Math.cos(angle);
        const y1 = CENTER + 28 * Math.sin(angle);
        const x2 = CENTER + 65 * Math.cos(angle);
        const y2 = CENTER + 65 * Math.sin(angle);
        
        // Petal Arc
        const cp1x = CENTER + 55 * Math.cos(angle - 0.3);
        const cp1y = CENTER + 55 * Math.sin(angle - 0.3);
        const cp2x = CENTER + 55 * Math.cos(angle + 0.3);
        const cp2y = CENTER + 55 * Math.sin(angle + 0.3);
        
        const pathData = `M ${x1} ${y1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2}`;
        addPath(pathData, 2.8, "#3b0910", 400 + i * 80);

        // Center dots
        const dotX = CENTER + 42 * Math.cos(angle);
        const dotY = CENTER + 42 * Math.sin(angle);
        addDot(dotX, dotY, 3, "#3b0910", 600 + i * 80);
      }

      // 2. Concentric Scalloped Ring
      addCircle(CENTER, CENTER, 75, 2.2, "#540d17", 1100);
      addCircle(CENTER, CENTER, 85, 1.8, "#3b0910", 1300);

      // 16 Scallop Arcs
      for (let i = 0; i < 16; i++) {
        const a1 = (i * 22.5) * Math.PI / 180;
        const a2 = ((i + 1) * 22.5) * Math.PI / 180;
        const r = 85;
        const x1 = CENTER + r * Math.cos(a1);
        const y1 = CENTER + r * Math.sin(a1);
        const x2 = CENTER + r * Math.cos(a2);
        const y2 = CENTER + r * Math.sin(a2);
        
        const midA = ((i + 0.5) * 22.5) * Math.PI / 180;
        const cpx = CENTER + (r + 14) * Math.cos(midA);
        const cpy = CENTER + (r + 14) * Math.sin(midA);

        const pathData = `M ${x1} ${y1} Q ${cpx} ${cpy}, ${x2} ${y2}`;
        addPath(pathData, 2.2, "#3b0910", 1500 + i * 50);

        // Small dot atop each scallop
        const dotX = CENTER + (r + 20) * Math.cos(midA);
        const dotY = CENTER + (r + 20) * Math.sin(midA);
        addDot(dotX, dotY, 2.5, "#540d17", 1700 + i * 50);
      }

      // 3. Intricate Paisley / Kalka Motifs (8-Fold Symmetry)
      addCircle(CENTER, CENTER, 120, 2.5, "#3b0910", 2300);

      for (let i = 0; i < 8; i++) {
        const angle = (i * 45 + 22.5) * Math.PI / 180;
        const rBase = 120;
        const rTip = 230;

        const bx = CENTER + rBase * Math.cos(angle);
        const by = CENTER + rBase * Math.sin(angle);
        const tx = CENTER + rTip * Math.cos(angle);
        const ty = CENTER + rTip * Math.sin(angle);

        // Paisley Curve Left
        const c1x = CENTER + (rBase + 45) * Math.cos(angle - 0.35);
        const c1y = CENTER + (rBase + 45) * Math.sin(angle - 0.35);
        const c2x = CENTER + (rTip - 20) * Math.cos(angle - 0.25);
        const c2y = CENTER + (rTip - 20) * Math.sin(angle - 0.25);

        // Paisley Curve Right
        const c3x = CENTER + (rTip - 20) * Math.cos(angle + 0.25);
        const c3y = CENTER + (rTip - 20) * Math.sin(angle + 0.25);
        const c4x = CENTER + (rBase + 45) * Math.cos(angle + 0.35);
        const c4y = CENTER + (rBase + 45) * Math.sin(angle + 0.35);

        const pathData = `M ${bx} ${by} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${tx} ${ty} C ${c3x} ${c3y}, ${c4x} ${c4y}, ${bx} ${by}`;
        addPath(pathData, 3, "#3b0910", 2500 + i * 120);

        // Inner Hatching Lines inside Paisley
        for (let h = 1; h <= 4; h++) {
          const hR = rBase + h * 22;
          const hx1 = CENTER + hR * Math.cos(angle - 0.12);
          const hy1 = CENTER + hR * Math.sin(angle - 0.12);
          const hx2 = CENTER + hR * Math.cos(angle + 0.12);
          const hy2 = CENTER + hR * Math.sin(angle + 0.12);
          addPath(`M ${hx1} ${hy1} Q ${CENTER + (hR + 5) * Math.cos(angle)} ${CENTER + (hR + 5) * Math.sin(angle)}, ${hx2} ${hy2}`, 1.8, "#540d17", 3200 + i * 100 + h * 60);
        }

        // Teardrop tip dot
        const tipDotX = CENTER + (rTip + 18) * Math.cos(angle);
        const tipDotY = CENTER + (rTip + 18) * Math.sin(angle);
        addDot(tipDotX, tipDotY, 4.5, "#3b0910", 3800 + i * 100);
      }

      // 4. Outer Leaf Vines & Filigree (16 Directions)
      for (let i = 0; i < 16; i++) {
        const angle = (i * 22.5) * Math.PI / 180;
        const r1 = 250;
        const r2 = 360;

        const x1 = CENTER + r1 * Math.cos(angle);
        const y1 = CENTER + r1 * Math.sin(angle);
        const x2 = CENTER + r2 * Math.cos(angle);
        const y2 = CENTER + r2 * Math.sin(angle);

        // Curved Vine Stem
        const cpx = CENTER + (r1 + 60) * Math.cos(angle + 0.15);
        const cpy = CENTER + (r1 + 60) * Math.sin(angle + 0.15);

        addPath(`M ${x1} ${y1} Q ${cpx} ${cpy}, ${x2} ${y2}`, 2.5, "#3b0910", 4200 + i * 80);

        // Leaf Sprouts along vine
        for (let l = 1; l <= 3; l++) {
          const lR = r1 + l * 32;
          const lx = CENTER + lR * Math.cos(angle);
          const ly = CENTER + lR * Math.sin(angle);
          
          const leafTipX = CENTER + (lR + 18) * Math.cos(angle + 0.2);
          const leafTipY = CENTER + (lR + 18) * Math.sin(angle + 0.2);

          addPath(`M ${lx} ${ly} Q ${CENTER + (lR + 10) * Math.cos(angle + 0.3)} ${CENTER + (lR + 10) * Math.sin(angle + 0.3)}, ${leafTipX} ${leafTipY}`, 2, "#540d17", 4600 + i * 60 + l * 50);
          addDot(leafTipX, leafTipY, 2.5, "#3b0910", 4800 + i * 60 + l * 50);
        }
      }

      // 5. Outer Border Ring & Delicate Dots Star Envelope
      addCircle(CENTER, CENTER, 375, 2, "#540d17", 5800);
      addCircle(CENTER, CENTER, 388, 1.5, "#3b0910", 6100);

      for (let i = 0; i < 32; i++) {
        const angle = (i * 11.25) * Math.PI / 180;
        const dotX = CENTER + 405 * Math.cos(angle);
        const dotY = CENTER + 405 * Math.sin(angle);
        addDot(dotX, dotY, i % 2 === 0 ? 4 : 2.5, "#3b0910", 6300 + i * 30);
      }
    }

    function addPath(d, strokeWidth, color, delayMs) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      path.setAttribute("class", "henna-stroke");
      path.setAttribute("stroke-width", strokeWidth);
      path.setAttribute("stroke", color);
      container.appendChild(path);

      const length = path.getTotalLength();
      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;
      path.style.opacity = '1';

      pathsToAnimate.push({
        element: path,
        length: length,
        delay: delayMs,
        duration: 1200
      });
    }

    function addCircle(cx, cy, r, strokeWidth, color, delayMs) {
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", cx);
      circle.setAttribute("cy", cy);
      circle.setAttribute("r", r);
      circle.setAttribute("class", "henna-stroke");
      circle.setAttribute("stroke-width", strokeWidth);
      circle.setAttribute("stroke", color);
      container.appendChild(circle);

      const length = 2 * Math.PI * r;
      circle.style.strokeDasharray = length;
      circle.style.strokeDashoffset = length;
      circle.style.opacity = '1';

      pathsToAnimate.push({
        element: circle,
        length: length,
        delay: delayMs,
        duration: 1400
      });
    }

    function addDot(cx, cy, r, color, delayMs) {
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", cx);
      circle.setAttribute("cy", cy);
      circle.setAttribute("r", r);
      circle.setAttribute("fill", color);
      circle.setAttribute("class", "henna-fill");
      circle.style.opacity = '0';
      circle.style.transform = 'scale(0)';
      circle.style.transformOrigin = `${cx}px ${cy}px`;
      container.appendChild(circle);

      pathsToAnimate.push({
        element: circle,
        isDot: true,
        delay: delayMs,
        duration: 500
      });
    }

    function startInfiniteLoopAnimation() {
      createHennaMandala();

      const startTime = performance.now();
      const TOTAL_DRAW_TIME = 8000; // 8 seconds drawing duration
      const HOLD_TIME = 2500;       // 2.5 seconds showcase hold
      const FADE_TIME = 1500;       // 1.5 seconds smooth transition reset

      function animateFrame(now) {
        const elapsed = now - startTime;

        pathsToAnimate.forEach(item => {
          if (elapsed >= item.delay) {
            const progress = Math.min((elapsed - item.delay) / item.duration, 1);
            // Ease out cubic
            const eased = 1 - Math.pow(1 - progress, 3);

            if (item.isDot) {
              item.element.style.opacity = eased;
              item.element.style.transform = `scale(${eased})`;
            } else {
              item.element.style.strokeDashoffset = item.length * (1 - eased);
            }
          }
        });

        if (elapsed < TOTAL_DRAW_TIME + HOLD_TIME) {
          requestAnimationFrame(animateFrame);
        } else if (elapsed < TOTAL_DRAW_TIME + HOLD_TIME + FADE_TIME) {
          // Smooth fade transition back to beginning
          const fadeProgress = (elapsed - (TOTAL_DRAW_TIME + HOLD_TIME)) / FADE_TIME;
          container.style.opacity = (1 - fadeProgress);
          requestAnimationFrame(animateFrame);
        } else {
          // Reset opacity & start loop again seamlessly
          container.style.opacity = '1';
          startInfiniteLoopAnimation();
        }
      }

      requestAnimationFrame(animateFrame);
    }

    // Launch initial loop
    startInfiniteLoopAnimation();
  </script>
</body>
</html>
